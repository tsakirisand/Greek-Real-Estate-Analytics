[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["api_client", "calculator", "create_tables", "database", "forecasting", "i18n", "loader", "logger", "main", "models", "profiler", "queries", "report_generator", "schemas"]


[project]
name = "greek-real-estate-analytics"
version = "0.1.0"
description = "Analytics platform for visualizing historical apartment prices in Greece based on official Bank of Greece datasets."
authors = [
    { name = "Developer", email = "dev@example.com" }
]
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.40.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "pandas>=2.2.0",
    "xlrd>=2.0.1",
    "openpyxl>=3.1.5",
    "plotly>=5.24.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
    "statsmodels>=0.14.0",
    "reportlab>=4.0.0",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
