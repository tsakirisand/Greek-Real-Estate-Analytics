version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: real_estate_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: greek_real_estate
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: real_estate_api
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/greek_real_estate
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  dashboard:
    build: .
    container_name: real_estate_dashboard
    restart: always
    command: streamlit run dashboard.py --server.port=8501 --server.address=0.0.0.0
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/greek_real_estate
    ports:
      - "8501:8501"
    depends_on:
      - postgres
      - api

volumes:
  postgres_data:
